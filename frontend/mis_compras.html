<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Reservas - AutoPremium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f8f9fa !important; animation: none !important; display: block !important; margin: 0; padding: 0; }
        .store-nav { background: #1a1a1a; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .store-nav .logo { color: white; font-size: 1.8em; font-weight: 800; text-decoration: none; letter-spacing: 1px;}
        .store-nav .logo span { color: #d32f2f; }
        .store-nav .menu a { color: #ddd; text-decoration: none; margin: 0 15px; font-weight: 500; font-size: 15px; transition: color 0.3s; }
        .store-nav .menu a:hover { color: #d32f2f; }
        
        .tabla-compras { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .tabla-compras th { background: #1a1a1a; color: white; padding: 15px; text-align: left; }
        .tabla-compras td { padding: 15px; border-bottom: 1px solid #eee; }
        .estatus-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    
    <nav class="store-nav">
        <a href="catalogo.html" class="logo" style="color: white; font-size: 1.8em; font-weight: 800; text-decoration: none; letter-spacing: 1px;">Auto<span style="color: #d32f2f;">Premium</span></a>
        <div class="menu">
            <a href="catalogo.html">Catálogo</a>
            <a href="mis_compras.html">Mis Reservas</a>
            <a href="catalogo.html">Modelos Recientes</a>
            <a href="mantenimiento.html">Mantenimiento</a>
            <a href="contacto.html" class="activo">Contacto</a>
        </div>
        <div>
            <button id="btnCerrarSesion" style="background: transparent; border: 1px solid #d32f2f; padding: 8px 15px; width: auto; font-size: 14px; color: white; cursor: pointer; border-radius: 4px;">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container" style="max-width: 1100px; margin: 50px auto; padding: 0 20px;">
        <h2 style="margin-bottom: 30px; color: #1a1a1a; border-left: 5px solid #d32f2f; padding-left: 15px;">Mi Historial de Reservas</h2>
        
        <table class="tabla-compras">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Folio</th>
                    <th>Vehículo</th>
                    <th>Precio Pagado</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="listaMisCompras">
                <tr><td colspan="6" style="text-align: center; padding: 40px;">Cargando tus reservas...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="mis_compras.js"></script>
</body>
</html>
